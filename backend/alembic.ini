# A generic, single database configuration for Alembic

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepended_sys_path = .

# timezone to use when rendering the date within the migration file as well as the filename.
# string value; defaults to UTC.
timezone = UTC

# max length of characters which are used to render the --autogenerate title
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command, regardless of autogenerate status
revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a matching .py file to be treated as revisions
sourceless = false

# version location specification; This defaults to alembic/versions.
version_locations = %(here)s/alembic/versions

# set to 'true' to search version_locations recursively
version_path_separator = os

# sqlalchemy.url = sqlite:///./authentiq_unified.db

[post_write_hooks]

[logging]
default_handler = console

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
