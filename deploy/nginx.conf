# AuthentiQ: website at /, admin portal at /admin/, API proxied at /api/.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 6m;   # Aadhaar upload limit is 5 MB
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # (nginx drops server-level add_header in locations that add their own, so every
    #  location includes the shared security headers)

    location /api/ {
        include /etc/nginx/snippets/security-headers.inc;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # product registration waits for a blockchain transaction
    }

    location /media/ {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        include /etc/nginx/snippets/security-headers.inc;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /admin/index.html;
    }
    location /admin/assets/ {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
