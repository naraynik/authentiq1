version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: authentiq-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authentiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  hardhat:
    build:
      context: ..
      dockerfile: ./infrastructure/Dockerfile.hardhat
    container_name: authentiq-hardhat
    restart: always
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8545 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: ./infrastructure/Dockerfile.backend
    container_name: authentiq-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/authentiq
      - RPC_URL=http://hardhat:8545
      - CONTRACT_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
      - CONTRACT_ABI_PATH=app/contracts/AuthentiQRegistry.json
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      hardhat:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: ./infrastructure/Dockerfile.frontend
    container_name: authentiq-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
